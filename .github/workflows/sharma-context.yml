name: Refresh Sharma news context
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sharma-context.yml'
      - 'scripts/sharma/**'
permissions:
  contents: write
  pages: write
concurrency:
  group: sharma-news-context
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Collect free GDELT metadata and check public social access
        run: python3 scripts/sharma/collect_context.py --universe scripts/sharma/universe.json
      - name: Publish the timestamped context only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sharma/data/context.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh timestamped Sharma news context'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Request a Pages rebuild for the branch-based website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
